[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "husar-net"
version = "0.1.0"
description = "Hierarchical uncertainty-aware spatial allocation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
husarnet = "husarnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
husarnet = ["_assets/*.pt"]
